[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfa4-devtools"
version = "0.1.0"
description = "CFA4 Linux development diagnostics and experimental Qt 6 frontend"
readme = "docs/development/linux.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
qt = ["PySide6>=6.10,<7"]

[project.scripts]
cfa4-doctor = "cfa4_devtools.health:main"
cfa4-qt = "cfa4_devtools.qt_app:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["cfa4_devtools*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["python/tests"]
