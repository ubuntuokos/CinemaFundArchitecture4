[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfa4-devtools"
version = "0.1.0"
description = "CFA4 Qt 6 GUI (PySide6) and Linux development diagnostics"
readme = "docs/development/linux.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
qt = ["PySide6>=6.10,<7"]
# Test oracle only (Apache-2.0): never imported by the product or shipped in packages.
# docs/plans/OTIO-INTEGRATION-2026-10-24.md, OTIO-1.1.
otio = ["opentimelineio>=0.18,<0.19"]

[project.scripts]
cfa4-doctor = "cfa4_devtools.health:main"
cfa4-qt = "cfa4_qt.__main__:main"
cfa4-qt-shell = "cfa4_devtools.qt_app:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["cfa4_devtools*", "cfa4_qt*"]

[tool.ruff]
target-version = "py312"
line-length = 120
# Az Ubuntu 26.04 alapértelmezett modern Python verziójának megfelelően (pl. 3.12 vagy 3.13)
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle hibák
    "F",    # pyflakes hibák
    "UP",   # pyupgrade: automatikusan jelzi és frissíti az elavult Python szintaxist
    "B",    # flake8-bugbear: gyakori hibák és elavult minták szűrése
    "TID",  # flake8-tidy-imports: tiltott modulok ellenőrzése
    "YTT",  # flake8-2020: elavult verzióellenőrzések tiltása
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Elavult Qt és régi GUI keretrendszerek importjának szigorú tiltása
"PyQt5".msg = "TILOS: Használj PySide6-ot (Qt 6)!"
"PyQt6".msg = "TILOS: A projekt szabványa a PySide6 (LGPLv3)!"
"PySide2".msg = "TILOS: Elavult Qt 5 könyvtár, használj PySide6-ot!"
"PySide6.QtWidgets.QDesktopWidget".msg = "Elavult Qt5 osztály. Használd a QScreen-t helyette!"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
