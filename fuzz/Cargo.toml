# CFA4 fuzz targets (CFA4-SECURITY-001 B2): `cargo +nightly fuzz run <target>` from the repository root,
# or `cargo test --lib --manifest-path fuzz/Cargo.toml` (stable) for the deterministic smoke run over the
# seed corpus. Its own workspace (excluded from the main one): libFuzzer needs nightly and a C++
# compiler, neither of which the quality gates require. See fuzz/README.md.
[package]
name = "cfa4-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
cfa4-aac = { path = "../crates/aac" }
cfa4-ac3 = { path = "../crates/ac3" }
cfa4-adpcm = { path = "../crates/adpcm" }
cfa4-apv = { path = "../crates/apv" }
cfa4-auro = { path = "../crates/auro" }
cfa4-av1 = { path = "../crates/av1" }
cfa4-avi = { path = "../crates/avi" }
cfa4-captions = { path = "../crates/captions" }
cfa4-cfb = { path = "../crates/cfb" }
cfa4-cineform = { path = "../crates/cineform" }
cfa4-credits = { path = "../crates/credits" }
cfa4-dcp = { path = "../crates/dcp" }
cfa4-dng = { path = "../crates/dng" }
cfa4-dnx = { path = "../crates/dnx" }
cfa4-dts = { path = "../crates/dts" }
cfa4-dv = { path = "../crates/dv" }
cfa4-ffv1 = { path = "../crates/ffv1" }
cfa4-h264 = { path = "../crates/h264" }
cfa4-hap = { path = "../crates/hap" }
cfa4-heif = { path = "../crates/heif" }
cfa4-hevc = { path = "../crates/hevc" }
cfa4-huffyuv = { path = "../crates/huffyuv" }
cfa4-iab = { path = "../crates/iab" }
cfa4-interchange = { path = "../crates/interchange" }
cfa4-isobmff = { path = "../crates/isobmff" }
cfa4-j2k = { path = "../crates/j2k" }
cfa4-jxl = { path = "../crates/jxl" }
cfa4-lcevc = { path = "../crates/lcevc" }
cfa4-matroska = { path = "../crates/matroska" }
cfa4-mpa = { path = "../crates/mpa" }
cfa4-mpeg2v = { path = "../crates/mpeg2v" }
cfa4-mpegts = { path = "../crates/mpegts" }
cfa4-mxf = { path = "../crates/mxf" }
cfa4-ogg = { path = "../crates/ogg" }
cfa4-opus = { path = "../crates/opus" }
cfa4-project = { path = "../crates/project" }
cfa4-prores = { path = "../crates/prores" }
cfa4-truehd = { path = "../crates/truehd" }
cfa4-utvideo = { path = "../crates/utvideo" }
cfa4-vp8 = { path = "../crates/vp8" }
cfa4-vp9 = { path = "../crates/vp9" }

# Opt-level 3 and debug assertions (overflow checks) for every crate under test, as release fuzzing does.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[profile.dev]
opt-level = 2
debug = "line-tables-only"

