[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]
# Cargo does not expand globs here: each vendored crate is named, so `--workspace` does not
# build their tests (their dev-dependencies stay out of Cargo.lock; scripts/dev/test-vendored-ui.sh).
exclude = [
    # CFA4-SECURITY-001 B2: cargo-fuzz targets, their own workspace (nightly + libFuzzer; fuzz/README.md)
    "fuzz",
    "vendor/cfa4-libs/docpath",
    "vendor/cfa4-libs/ui",
    "vendor/ffmpeg-bindings/rsmedia",
    "vendor/ffmpeg-bindings/rsmpeg",
    "vendor/ffmpeg-bindings/rusty_ffmpeg",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"
repository = "https://github.com/ubuntuokos/CinemaFundArchitecture4"

