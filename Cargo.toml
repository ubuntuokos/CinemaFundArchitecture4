# FFmpeg bindings of cfa4-ffmpeg (ADR 0005), vendored snapshots (vendor/ffmpeg-bindings/*/SOURCE_MANIFEST.json)
rsmedia = { version = "0.7.1", path = "vendor/ffmpeg-bindings/rsmedia", default-features = false, features = ["ndarray", "ffmpeg9", "link_system_ffmpeg"] }
rsmpeg = { version = "0.18.1", path = "vendor/ffmpeg-bindings/rsmpeg", default-features = false, features = ["ffmpeg9", "link_system_ffmpeg"] }
rusty_ffmpeg = { version = "0.18.1", path = "vendor/ffmpeg-bindings/rusty_ffmpeg" }
cfa4-metrics = { path = "crates/metrics" }
cfa4-sandbox = { path = "crates/sandbox" }
cfa4-vdb = { path = "crates/vdb" }
cfa4-fetch-client = { path = "crates/fetch-client" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
# D-Cinema decryption (ST 429-6 encrypted triplets, ST 430-1 KDM; #933): RustCrypto, MIT OR Apache-2.0
aes = "0.9"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
base64 = "0.23"
cfa4-docpath = { version = "0.1.0", path = "vendor/cfa4-libs/docpath" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
cfa4-ui = { version = "0.1.0", path = "vendor/cfa4-libs/ui", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
# CFA4-LINTS-001: no deprecated API, no future-incompatible code, idiomatic 2018+ Rust.
# Lint groups need priority -1 so individual lints can still override them.
deprecated = "deny"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

