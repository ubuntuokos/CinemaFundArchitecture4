name: CFA4 AV2 oracle (manual)

# AV2 plan X/3: builds the pinned AVM v1.0.0 oracle and the av2-normative cross-check into
# private prefixes, regenerates the hashed AV2 corpus and checks it against the committed
# manifest (crates/testkit/data/av2-corpus.json). Expensive (two AVM builds), so it runs ONLY
# on workflow_dispatch or on a `cfa4-full-validation` label event of a PR that touches the AV2
# harness; never on ordinary commits and never on a schedule (AGENTS.md). Not a required check.
# Plan X/6 adds the early decoder (ADR 0010): the pinned dav2d and the cfa4-av2-decode helper,
# checked against the same manifest. G1 adds an ASan+UBSan build of the helper and a fixed-seed fuzz run.

on:
  pull_request:
    types: [labeled]
    paths:
      - "crates/testkit/**"
      - "crates/av2/**"
      - "crates/codecs/src/av2*"
      - "crates/codecs/tests/av2_external.rs"
      - "packaging/av2-decode/**"
      - "scripts/dev/av2-*"
      - ".github/workflows/cfa4-av2-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfa4-av2-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  av2-oracle:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'cfa4-full-validation')
    name: AV2 oracle harness (AVM v1.0.0 + av2-normative)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ubuntu 26.04 host gate
        run: bash scripts/ci/require-ubuntu-2604.sh
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build meson nasm git ffmpeg
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show
      - name: Build AVM v1.0.0 (oracle) into target/av2-oracle
        run: python3 scripts/dev/av2-oracle.py build --ref v1.0.0
      - name: Build AVM av2-normative (cross-check) into target/av2-oracle
        run: python3 scripts/dev/av2-oracle.py build --ref av2-normative
      - name: Generate the corpus and check bitstreams against the manifest
        run: python3 scripts/dev/av2-oracle.py corpus
      - name: Oracle tests (skips are failures)
        env:
          CFA4_REQUIRE_AV2_ORACLE: "1"
        run: cargo test --locked -p cfa4-testkit --test av2_oracle -- --nocapture
      - name: Build dav2d and the cfa4-av2-decode helper into target/av2-decoder
        run: python3 scripts/dev/av2-decoder.py build
      - name: Clippy with the av2-external feature
        run: cargo clippy --locked -p cfa4-codecs --features av2-external --all-targets -- -D warnings
      - name: External decoder against the oracle (skips are failures)
        env:
          CFA4_REQUIRE_AV2_ORACLE: "1"
        run: cargo test --locked -p cfa4-codecs --features av2-external --test av2_external -- --nocapture
      - name: Build the helper with ASan and UBSan into target/av2-decoder-asan
        run: python3 scripts/dev/av2-decoder.py build --sanitize
      # Report only while the pinned dav2d has known fuzzing failures (AV2-00 audit, 13. pont):
      # G1 needs this step to pass with 0 failures, and then continue-on-error goes away.
      - name: Fuzz the sanitized helper (Main_420_10_IP0 corpus, fixed seed, 3000 rounds; report only)
        continue-on-error: true
        run: python3 scripts/dev/av2-decoder.py fuzz --rounds 3000
