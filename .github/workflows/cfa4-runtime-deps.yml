name: CFA4 runtime dependencies on Ubuntu 26.04 (F2-01, F9)

# Measures the run-time dependencies of the release binaries on a clean GitHub-hosted
# Ubuntu 26.04 AMD64 runner (F9 gate `runtime_abi_dependencies`, docs/audit/F9-RELEASE-STATUS-2026-11-08.md).
# Development runs in the cloud, so this replaces the measurement on the owner's machine
# (docs/audit/F2-01-RUNTIME-DEPS-2026-10-25.md). The binaries are built with the packaged features
# (packaging/linux/package.sh). The report goes to the job summary and the log; nothing is uploaded
# or published, and nothing is installed beyond the build packages.

# Manual only (AGENTS.md CI rule): automatic PR checks compile nothing beyond the
# required `cargo-check` gate, and this job runs a release build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfa4-runtime-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure release binary runtime dependencies (Ubuntu 26.04 AMD64)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native build dependencies (the packaged features include GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build binutils \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev \
            libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev nasm \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Build the release binaries with the packaged features
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: cargo build --release --locked -p cfa4 -p cfa4-cli --features cfa4/gstreamer,cfa4-cli/gstreamer
      - name: Measure (objdump, ldd, dpkg-query)
        run: |
          bash scripts/dev/audit-runtime-deps.sh
          report="$(ls -d target/audit/runtime-deps/*/ | tail -n 1)"
          {
            echo "## Runtime dependencies on $(. /etc/os-release && echo "$PRETTY_NAME") ($(uname -m))"
            echo
            echo "Commit: \`$GITHUB_SHA\`. Features: \`cfa4/gstreamer,cfa4-cli/gstreamer\` (packaging/linux/package.sh)."
            echo
            cat "$report/runtime-deps.md"
            echo
            echo "<details><summary>runtime-deps.json</summary>"
            echo
            echo '```json'
            cat "$report/runtime-deps.json"
            echo '```'
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$report/runtime-deps.md"
          python3 - "$report/runtime-deps.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if not report.get("host", {}).get("ubuntu_2604"):
              sys.exit("error: the runner is not Ubuntu 26.04; the report is not F9 evidence")
          print("PASS: measured on Ubuntu 26.04 AMD64")
          PY
