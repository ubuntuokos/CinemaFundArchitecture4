name: CFA4 Linux AMD64 (manual full validation)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # the main branch's merge queue (#719): each queued PR is validated once, on top of main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfa4-ci-${{ github.ref }}
  cancel-in-progress: true

# PRs and main pushes run only the fast, non-compiling platform/static gate.
# Expensive Rust/Qt/FFmpeg jobs run ONLY on workflow_dispatch, an explicit
# PR `cfa4-full-validation` label event (not on ordinary commits), or in the
# main branch's merge queue (`merge_group`, #719): there the queued PR is
# validated once on top of the current main, so a merge no longer invalidates
# the other PRs' runs. Full validation must pass before merging or releasing;
# the required `full-validation-gate` job enforces this in the merge queue (and
# on labeled pull requests, as an early check).
jobs:
  platform-scope:
    name: Linux AMD64 policy and static checks (no builds)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce platform and check shell/static configuration
        run: bash scripts/ci/check-linux-amd64.sh

  rust-linux:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Rust workspace (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev \
            libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev nasm curl xz-utils \
            libheif-examples libheif-plugin-libde265 libheif-plugin-x265 libjxl-tools
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Licence policy and security advisories (docs/licensing.md, deny.toml)
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check licenses sources advisories
      - name: Linux quality gates (no WASM target)
        env:
          CFA4_REQUIRE_ORACLES: "1"
        run: cargo xtask ci
      - name: HEIF/HEIC native import and export oracles
        env:
          CFA4_REQUIRE_ORACLES: "1"
        run: |
          cargo test --locked -p cfa4-media --test heif_oracle
          cargo test --locked -p cfa4-export --lib heic_heif_single_frame_exports_round_trip

  rust-cli-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Rust CLI build and runtime smoke (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev \
            libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev nasm curl xz-utils
      - name: Build the Linux Rust command-line engine
        run: cargo build --locked --release -p cfa4-cli
      - name: Execute compiled engine smoke
        run: |
          target/release/cfa4-cli --version
          target/release/cfa4-cli --demo inspect project
      # The Qt GUI's tests that drive the real engine (`REAL` in test_qt_gui.py) need this build;
      # the Qt 6 GUI job runs without it and skips them. Non-blocking, like that job, until the Qt6
      # GUI is complete (docs/coordination.md §3.4).
      - name: Headless Qt runtime libraries
        run: |
          # QtMultimedia (audio output choice) loads libpulse even with no sound server
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0 libpulse0 libpulse-mainloop-glib0
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/linux-amd64.txt
          python -m pip install --no-deps -e .
      - name: Qt 6 GUI tests with the real engine (non-blocking)
        continue-on-error: true
        timeout-minutes: 60
        env:
          QT_QPA_PLATFORM: offscreen
          CFA4_ENGINE: ${{ github.workspace }}/target/release/cfa4-cli
        run: python -m pytest -q -rf --durations=15 python/tests/test_qt_gui.py

  gstreamer-backend:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Optional GStreamer backend (ADR 0002, feature on)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GStreamer development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Clippy with the gstreamer feature
        run: cargo clippy --locked -p cfa4-gstreamer --all-targets --features gstreamer -- -D warnings
      - name: Tests with the gstreamer feature
        run: cargo test --locked -p cfa4-gstreamer --features gstreamer -- --nocapture
      - name: Probe report
        run: cargo run --locked -p cfa4-gstreamer --features gstreamer --example gst_probe

  vendored-docpath:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Vendored cfa4-docpath offline tests (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify isolated vendor crate without network sources
        run: |
          # Test a detached copy so a nested [workspace] does not conflict with CFA4.
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp -a vendor/cfa4-libs/docpath/. "$tmpdir/"
          printf '\n[workspace]\n' >> "$tmpdir/Cargo.toml"
          cargo test --offline --manifest-path "$tmpdir/Cargo.toml"
          cargo clippy --offline --manifest-path "$tmpdir/Cargo.toml" --all-targets -- -D warnings

  vendored-ui:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Vendored cfa4-ui unit and integration tests (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native UI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev \
            libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Test vendored UI library (no external cfa4-libs Git)
        run: bash scripts/dev/test-vendored-ui.sh

  rust-architecture-assets:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Rust architecture and asset gates (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust formatting
        run: cargo xtask fmt-check
      - name: Architecture dependency layering
        run: cargo xtask layers
      - name: Asset attribution and licensing
        run: cargo xtask assets

  rust-release-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Rust workspace tests with FFmpeg oracles (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # Job level, because rust-cache hashes CARGO_* variables into its key: keep these identical
    # to ci-cache-warm.yml. Keep release opt-level and all tests, but disable costly link-time
    # optimization for test harnesses; the CLI smoke still checks the unmodified release profile.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Linux dependencies and test oracles
        run: bash scripts/ci/install-ffmpeg-oracle-deps.sh
      # Caches are written only on main by ci-cache-warm.yml: a cache saved in a merge-queue
      # or pull-request run is not visible to the next run, only one saved on main is. So
      # these steps only restore, and a miss falls back to building (as before).
      - name: Restore FFmpeg 9.0.2 (saved on main by ci-cache-warm.yml)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cfa4/ffmpeg-9.0.2-linux-x86_64-v8
          key: cfa4-ffmpeg-9.0.2-ubuntu-26.04-linux-x86_64-v8
      - name: Install verified FFmpeg 9.0.2
        run: bash scripts/ci/install-ffmpeg-9.0.2.sh
      - name: Assert Ubuntu 26.04 and FFmpeg 9.0.2 versions
        run: |
          . /etc/os-release
          test "$ID" = "ubuntu" && test "$VERSION_ID" = "26.04"
          ffmpeg -version
          ffprobe -version
          ffmpeg_actual="$(ffmpeg -version | awk 'NR==1 {print $3}')"
          ffprobe_actual="$(ffprobe -version | awk 'NR==1 {print $3}')"
          if [[ "$ffmpeg_actual" != "9.0.2" || "$ffprobe_actual" != "9.0.2" ]]; then
            echo "::error::CFA4 CI requires ffmpeg and ffprobe 9.0.2 (got $ffmpeg_actual / $ffprobe_actual)."
            exit 1
          fi
          if ! ffmpeg -hide_banner -decoders | grep -Eq '^[[:space:]]*V[^[:space:]]*[[:space:]]+apv([[:space:]]|$)'; then
            echo "::error::The installed FFmpeg has no APV video decoder."
            exit 1
          fi
          if ! ffmpeg -hide_banner -decoders | grep -Eq '^[[:space:]]*V[^[:space:]]*[[:space:]]+libdav1d([[:space:]]|$)'; then
            echo "::error::The installed FFmpeg has no libdav1d AV1 decoder."
            exit 1
          fi
      - name: Rust toolchain from rust-toolchain.toml (part of the rust-cache key)
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Restore Rust release dependencies (saved on main by ci-cache-warm.yml)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cfa4-release-oracle
          save-if: "false"
      - name: Run optimized Rust workspace release tests with FFmpeg oracles
        env:
          CFA4_REQUIRE_ORACLES: "1"
        run: cargo test --workspace --exclude cfa4-ui --release --locked --timings

  python-qt6-linux:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Python and Qt 6 (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/linux-amd64.txt
          python -m pip install --no-deps -e .
      - name: Python static checks and tests
        run: |
          python -m compileall -q python
          python -m ruff check python
          python -m pytest -q python/tests --ignore=python/tests/test_qt_gui.py
          python -m unittest discover -s packaging/linux -p 'test_*.py' -v
          python -m cfa4_devtools.dependency_audit

  # OTIO-1.3 (docs/plans/OTIO-INTEGRATION-2026-10-24.md): the official OpenTimelineIO package checks
  # the .otio files CFA4 writes. Full validation only, so the fast PR gate stays as it is. The oracle
  # comes from its own hash-pinned lock: a development tool, never imported or shipped by the product.
  otio-oracle:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: OpenTimelineIO test oracle (OTIO-1.3)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CFA4_OTIO_ORACLE_DIR: target/fixtures/otio-oracle
      CFA4_OTIO_SAMPLES_DIR: target/fixtures/otio-samples
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          cargo --version
      - name: Write the OTIO fixtures and manifest (creates CFA4_OTIO_ORACLE_DIR)
        run: cargo test --locked -p cfa4-interchange --test otio oracle_fixtures
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the oracle and the Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/linux-amd64.txt
          python -m pip install --require-hashes -r requirements/otio-oracle.txt
          python -m pip install --no-deps -e .
      - name: OpenTimelineIO oracle (exit 0 PASS, 1 FAIL, 2 cannot run)
        run: python -m cfa4_devtools.otio_oracle "$CFA4_OTIO_ORACLE_DIR"
      - name: Oracle unit tests, including the fixture-backed ones
        run: python -m pytest -q -rs python/tests/test_otio_oracle.py python/tests/test_otio_samples.py
      # OTIO-1.2, the other direction: OTIO writes samples for every schema the reader handles and
      # CFA4 imports them (only the expected warnings, the same timing as OTIO).
      - name: Write the OTIO samples (creates CFA4_OTIO_SAMPLES_DIR)
        run: python -m cfa4_devtools.otio_samples "$CFA4_OTIO_SAMPLES_DIR"
      - name: Import the OTIO samples with CFA4
        run: cargo test --locked -p cfa4-interchange --test otio oracle_samples

  # Owner decision 2026-10-30: the Qt6 GUI is not finished yet, so its tests run and are reported,
  # but they do NOT block merging (this job is not part of full-validation-gate). Move it into the
  # gate's `needs` once the Qt6 GUI is complete.
  qt6-gui:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Qt 6 GUI tests (non-blocking until the Qt6 GUI is complete)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/linux-amd64.txt
          python -m pip install --no-deps -e .
      - name: Qt 6 GUI tests
        run: python -m pytest -q python/tests/test_qt_gui.py
      - name: Qt 6 offscreen widget smoke
        run: python -m cfa4_devtools.qt_app --smoke
      # qt-parity 1.9: the Qt GUI on a real X11 (Xvfb) and Wayland (weston headless) server. Last,
      # because weston pulls in libpipewire without its client config, where Qt Multimedia's
      # PipeWire backend crashes: the GUI tests above run without it. No Rust here: the tests' fake
      # engine serves the window.
      - name: Qt 6 GUI on X11 and Wayland
        run: |
          sudo apt-get install -y --no-install-recommends xvfb weston \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-xkb1
          QT_AUDIO_BACKEND=alsa python -m pytest -q -rs python/tests/test_qt_display_servers.py
        env:
          QT_QPA_PLATFORM: ""
          CFA4_REQUIRE_DISPLAY_SERVERS: "1"

  # Owner decision 2026-11-14 (CFA4-TITLE-CREDITS-001, Q6): the Python checks also run on
  # Python 3.14. Same steps as the gate's Python part, on 3.14; reported, but NOT blocking (not
  # in full-validation-gate's `needs`) until the owner makes it a required check.
  python-3-14:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Python 3.14 static checks and tests (non-blocking)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/linux-amd64.txt
          python -m pip install --no-deps -e .
      - name: Python static checks and tests
        run: |
          python --version
          python -m compileall -q python
          python -m ruff check python
          python -m pytest -q python/tests --ignore=python/tests/test_qt_gui.py
          python -m unittest discover -s packaging/linux -p 'test_*.py' -v
          python -m cfa4_devtools.dependency_audit

  # Required status check for main (owner decision 2026-10-31, docs/coordination.md §3.4):
  # green only if every blocking full-validation job really ran and succeeded on this head.
  # A skipped job (no `cfa4-full-validation` label / no workflow_dispatch) fails the gate.
  # Not run on pushes to main, which only carry the fast static gate.
  full-validation-gate:
    if: always() && github.event_name != 'push'
    needs:
      - platform-scope
      - rust-linux
      - rust-cli-smoke
      - gstreamer-backend
      - vendored-docpath
      - vendored-ui
      - rust-architecture-assets
      - rust-release-tests
      - python-qt6-linux
      - otio-oracle
    name: full-validation-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every blocking full-validation job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {job: info.get("result") for job, info in needs.items() if info.get("result") != "success"}
          for job, info in sorted(needs.items()):
              print(f"{job}: {info.get('result')}")
          if bad:
              print("::error::Full validation did not pass on this head: "
                    + ", ".join(f"{j}={r}" for j, r in sorted(bad.items()))
                    + ". Add the 'cfa4-full-validation' label (remove and re-add to repeat) or run workflow_dispatch.")
              sys.exit(1)
          print("Full validation passed on this head.")
          PY
