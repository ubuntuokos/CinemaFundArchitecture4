name: CFA4 Linux AMD64 (manual full validation)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfa4-ci-${{ github.ref }}
  cancel-in-progress: true

# PRs and main pushes run only the fast, non-compiling platform/static gate.
# Expensive Rust/Qt/FFmpeg jobs run ONLY on workflow_dispatch or an explicit
# PR `cfa4-full-validation` label event (not on ordinary commits).
# Full validation must pass before merging or releasing.
jobs:
  platform-scope:
    name: Linux AMD64 policy and static checks (no builds)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce platform and check shell/static configuration
        run: bash scripts/ci/check-linux-amd64.sh

  rust-linux:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Rust workspace (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev \
            libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev nasm curl xz-utils
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Linux quality gates (no WASM target)
        env:
          FILMCRAFT_REQUIRE_ORACLES: "1"
        run: cargo xtask ci

  rust-cli-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Rust CLI build and runtime smoke (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev \
            libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev nasm curl xz-utils
      - name: Build the Linux Rust command-line engine
        run: cargo build --locked --release -p filmcraft-cli
      - name: Execute compiled engine smoke
        run: |
          target/release/filmcraft-cli --version
          target/release/filmcraft-cli --demo inspect project

  vendored-docpath:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Vendored craft-docpath offline tests (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify isolated vendor crate without network sources
        run: |
          # Test a detached copy so a nested [workspace] does not conflict with CFA4.
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp -a vendor/craft-libs/docpath/. "$tmpdir/"
          printf '\n[workspace]\n' >> "$tmpdir/Cargo.toml"
          cargo test --offline --manifest-path "$tmpdir/Cargo.toml"
          cargo clippy --offline --manifest-path "$tmpdir/Cargo.toml" --all-targets -- -D warnings

  vendored-ui:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Vendored craft-ui unit and integration tests (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native UI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev \
            libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Test vendored UI library (no external craft-libs Git)
        run: bash scripts/dev/test-vendored-ui.sh

  rust-architecture-assets:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Rust architecture and asset gates (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust formatting
        run: cargo xtask fmt-check
      - name: Architecture dependency layering
        run: cargo xtask layers
      - name: Asset attribution and licensing
        run: cargo xtask assets

  rust-release-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Rust workspace tests with FFmpeg oracles (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native Linux dependencies and test oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev \
            libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev nasm curl xz-utils
      - name: Cache FFmpeg 9.0.2
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cfa4/ffmpeg-9.0.2-linux-x86_64-v1
          key: cfa4-ffmpeg-9.0.2-ubuntu-26.04-linux-x86_64-v1
      - name: Install verified FFmpeg 9.0.2
        run: bash scripts/ci/install-ffmpeg-9.0.2.sh
      - name: Assert Ubuntu 26.04 and FFmpeg 9.0.2 APV oracles
        run: |
          . /etc/os-release
          test "$ID" = "ubuntu" && test "$VERSION_ID" = "26.04"
          ffmpeg -version
          ffprobe -version
          ffmpeg_actual="$(ffmpeg -version | awk 'NR==1 {print $3}')"
          ffprobe_actual="$(ffprobe -version | awk 'NR==1 {print $3}')"
          if [[ "$ffmpeg_actual" != "9.0.2" || "$ffprobe_actual" != "9.0.2" ]]; then
            echo "::error::CFA4 CI requires ffmpeg and ffprobe 9.0.2 (got $ffmpeg_actual / $ffprobe_actual)."
            exit 1
          fi
          if ! ffmpeg -hide_banner -decoders | grep -Eq '^[[:space:]]*V[^[:space:]]*[[:space:]]+apv([[:space:]]|$)'; then
            echo "::error::The installed FFmpeg has no APV video decoder."
            exit 1
          fi
      - name: Run optimized Rust workspace release tests with FFmpeg oracles
        env:
          FILMCRAFT_REQUIRE_ORACLES: "1"
          # Keep release opt-level and all tests, but disable costly link-time optimization
          # for test harnesses; the CLI smoke still checks the unmodified release profile.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_BUILD_JOBS: "2"
        run: cargo test --workspace --exclude craft-ui --release --locked --timings

  python-qt6-linux:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'cfa4-full-validation')
    needs: platform-scope
    name: Python and Qt 6 (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,qt]"
      - name: Python static checks and tests
        run: |
          python -m compileall -q python
          python -m ruff check python
          python -m pytest -q python/tests
          python -m cfa4_devtools.dependency_audit
      - name: Qt 6 offscreen widget smoke
        run: python -m cfa4_devtools.qt_app --smoke
