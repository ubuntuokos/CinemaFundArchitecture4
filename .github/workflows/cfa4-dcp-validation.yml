name: CFA4 DCP validation

# Plan DCP-VALIDATION-2026-10-27 §13 (DCP-21): the DCP validation tests in one workflow of their own:
# the native validator with its known-result fixture matrix, the acceptance checks of §14
# (docs/development/dcp-acceptance.md), the reference-engine adapter (its parity test skips without
# the engine), the engine's DCP commands and the Linux packaging rules (no Ruby, no global gems).
# Offline after the crates are fetched, CPU only, no network service, no host change.
#
# Not an automatic check (AGENTS.md CI rule): it runs on workflow_dispatch or the PR
# `cfa4-full-validation` label event. Non-blocking at first, like the other validation workflows.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    paths:
      - crates/dcp/**
      - crates/dcp-validate/**
      - crates/dcp-inspect/**
      - crates/engine/src/dcp_*.rs
      - crates/engine/src/dcp_*/**
      - packaging/linux/**
      - docs/development/dcp-*.md
      - .github/workflows/cfa4-dcp-validation.yml

permissions:
  contents: read

concurrency:
  group: cfa4-dcp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dcp-validation:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'cfa4-full-validation')
    name: DCP validation tests (CPU only, offline)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake nasm libasound2-dev libudev-dev
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          cargo --version
      - name: Native validator, fixture matrix and acceptance checks
        run: cargo test --locked --release -p cfa4-dcp -p cfa4-dcp-validate
      - name: Reference-engine adapter (parity test skips without the engine)
        run: cargo test --locked --release -p cfa4-dcp-inspect
      - name: Engine DCP commands (export checks, repair plan, save formats)
        run: cargo test --locked --release -p cfa4-engine dcp
      - name: Linux packaging rules for DCP validation
        if: hashFiles('packaging/linux/test_dcp_validation.py') != ''
        run: python3 packaging/linux/test_dcp_validation.py
