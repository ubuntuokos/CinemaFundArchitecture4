name: CFA4 CI cache warm-up (main only)

# GitHub Actions caches are scoped by branch: a run sees caches saved on its own
# ref and on the default branch, nothing else. Full validation runs only in the
# merge queue, on labeled pull requests and on workflow_dispatch, so a cache it
# saves is never visible to the next run, and the pinned FFmpeg 9.0.2 oracle and
# the Rust release dependencies were rebuilt from source every time.
# This workflow builds both on main and saves them there; the rust-release-tests
# job in ci-linux.yml only restores them. Nothing here is a merge gate.
on:
  # Owner decision (2026-11-13): the Rust release dependencies are no longer rebuilt on every
  # main merge that touches Cargo.lock or a Cargo.toml (several 20-30 minute rebuilds a day).
  # They are refreshed once a night instead; until then the full jobs restore the previous
  # night's cache (rust-cache falls back to the closest key) and compile only what changed.
  # A push still warms the caches when the FFmpeg build scripts, the toolchain or this workflow
  # change, because a cache miss there would rebuild FFmpeg or everything in every full run.
  push:
    branches: [main]
    paths:
      - scripts/ci/install-ffmpeg-9.0.2.sh
      - scripts/ci/install-ffmpeg-oracle-deps.sh
      - rust-toolchain.toml
      - .github/workflows/ci-cache-warm.yml
  # Nightly at 01:17 UTC (02:17 Budapest); also keeps the caches inside GitHub's 7-day eviction.
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfa4-ci-cache-warm
  cancel-in-progress: true

jobs:
  release-oracle-cache:
    if: github.ref == 'refs/heads/main'
    name: Warm FFmpeg 9.0.2 and Rust release caches
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    # Must stay identical to the rust-release-tests job env in ci-linux.yml:
    # rust-cache hashes CARGO_* variables into its cache key.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Linux dependencies and test oracles
        run: bash scripts/ci/install-ffmpeg-oracle-deps.sh
      - name: Cache FFmpeg 9.0.2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cfa4/ffmpeg-9.0.2-linux-x86_64-v7
          key: cfa4-ffmpeg-9.0.2-ubuntu-26.04-linux-x86_64-v7
      - name: Build (or verify cached) FFmpeg 9.0.2
        run: bash scripts/ci/install-ffmpeg-9.0.2.sh
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Rust release dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cfa4-release-oracle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile the release test harnesses (no test run)
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo test --workspace --exclude cfa4-ui --release --locked --no-run
