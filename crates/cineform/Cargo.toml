[package]
name = "cfa4-cineform"
description = "Pure-Rust GoPro CineForm (CFHD) decoder and encoder, ported from the Apache-2.0/MIT CineForm SDK"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
cfa4-bitstream = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
cfa4-isobmff = { workspace = true }
cfa4-testkit = { workspace = true }
