[package]
name = "cfa4-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cfa4-time = { workspace = true }
cfa4-color = { workspace = true }
cfa4-frame = { workspace = true }
cfa4-media = { workspace = true }
cfa4-avi = { workspace = true }
cfa4-isobmff = { workspace = true }
cfa4-matroska = { workspace = true }
cfa4-mxf = { workspace = true }
cfa4-mpegts = { workspace = true }
cfa4-mpeg2v = { workspace = true }
cfa4-ac3 = { workspace = true }
cfa4-mpa = { workspace = true }
cfa4-ogg = { workspace = true }
cfa4-bitstream = { workspace = true }
cfa4-h264 = { workspace = true }
cfa4-hevc = { workspace = true }
cfa4-vp8 = { workspace = true }
cfa4-vp9 = { workspace = true }
cfa4-prores = { workspace = true }
cfa4-dnx = { workspace = true }
cfa4-av1 = { workspace = true }
cfa4-apv = { workspace = true }
cfa4-aac = { workspace = true }
cfa4-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
cfa4-testkit = { workspace = true }
serde_json = { workspace = true }
