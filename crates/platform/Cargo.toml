[package]
name = "cfa4-platform"
description = "OS media integration: hardware video decoding through the operating system's codecs (VA-API and NVDEC on Linux), with transparent fallback to the pure-Rust decoders"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The one crate allowed to contain `unsafe` (OS media FFI; AGENTS.md §0.3, docs/adr/0001-platform-ffi.md).
# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`: only the FFI modules
# opt in with `#[allow(unsafe_code)]`, and every `unsafe` block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
cfa4-bitstream = { workspace = true }
cfa4-codecs = { workspace = true }
cfa4-color = { workspace = true }
cfa4-export = { workspace = true }
cfa4-frame = { workspace = true }
cfa4-h264 = { workspace = true }
cfa4-hevc = { workspace = true }
cfa4-isobmff = { workspace = true }
cfa4-route = { workspace = true }
cfa4-time = { workspace = true }
log = { workspace = true }

# Linux: libva (VA-API) is loaded at run time with libloading (ISC; already in the lockfile through
# wgpu), so building needs no libva headers and a system without libva simply decodes in software.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[dev-dependencies]
cfa4-testkit = { workspace = true }
cfa4-media = { workspace = true }
cfa4-frame = { workspace = true }
cfa4-project = { workspace = true }
cfa4-render = { workspace = true }
