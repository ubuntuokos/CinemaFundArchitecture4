# MiraBox family (AJAZZ, MiraBox, SOOMFON, Redragon). Plan §2, §5.2 and the 2026-11-13 AJAZZ addition.
# Adapter: `mirabox-family`, a child process on mirajazz (MPL-2.0). One long-lived connection per
# device; initialisation and CRT DIS only once (the 2026-11-13 rule). USB ids come from the device
# itself or the AJAZZ device matrix and stay UNCONFIRMED until a report confirms them.
format = "cfa4-surface-catalog"
version = 1
family = "mirabox-family"

[[model]]
id = "ajazz.akp153e"
vendor = "AJAZZ"
name = "AKP153E"
kind = "lcd_keypad"
goal = "MODEL_DEPENDENT"
adapter = "mirabox-family"
phase = "M2"
connection = ["usb"]
source = "mirajazz (MPL-2.0), dependency of the adapter process"
baseline = ["keys.press", "keys.release", "keys.image"]
notes = [
    "First M2 model: the device the owner has (2026-11-13).",
    "USB ids, key image size and rotation are recorded by the wizard's identification step on first connection.",
    "Output (key images, brightness) stays behind Experimental features until a cfa4-hil report.",
]

[[model.controls]]
id = "keys"
type = "lcd_key"
count = 15
rows = 3
columns = 5
features = { press = "UNTESTED", release = "UNTESTED", image = "UNTESTED", brightness = "UNTESTED" }

[[model.controls]]
id = "device"
type = "device"
features = { identify = "UNSUPPORTED", firmware_query = "UNTESTED", sleep = "UNTESTED", haptic = "NOT_APPLICABLE", hotplug = "UNTESTED" }

