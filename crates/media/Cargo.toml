[package]
name = "cfa4-media"
description = "Media sources: probing, decoding traits, frame cache, generators, stills"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cfa4-time = { workspace = true }
cfa4-color = { workspace = true }
cfa4-frame = { workspace = true }
cfa4-dng = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }

[dev-dependencies]
cfa4-testkit = { workspace = true }
cfa4-dng = { workspace = true, features = ["writer"] }
# APNG fixtures for the animated-image tests (the image crate does not encode APNG)
png = "0.18"
