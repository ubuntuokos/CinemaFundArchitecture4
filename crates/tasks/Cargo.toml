[package]
name = "cfa4-tasks"
description = "CFA4-wide task and resource infrastructure (ACS): hardware discovery and runtime resource monitoring, nominal and current resources kept apart; later the resource manager, queue and scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cfa4-route = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# IANA time zone database (bundled, so every build resolves zones the same way); chrono-tz is
# unmaintained (RUSTSEC-2026-0555). Calendar arithmetic stays in chrono.
jiff = { version = "1", default-features = false, features = ["std", "tzdb-bundle-always"] }

[dev-dependencies]
serde_json = { workspace = true }
