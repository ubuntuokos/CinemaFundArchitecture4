[package]
name = "cfa4-dcp-validate"
description = "DCP validation API (DCP-03): validator trait, result states, profiles, report, package discovery and the native backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cfa4-audio-dsp = { workspace = true }
cfa4-dcp = { workspace = true }
cfa4-iab = { workspace = true }
cfa4-j2k = { workspace = true }
cfa4-mxf = { workspace = true }
chrono = { workspace = true }
# DCP-10: the CPL and PKL are read again for their ds:Signature (cfa4_dcp::xmldsig takes a roxmltree document).
roxmltree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# DCP-24: SHA-256 of the files in a package manifest.
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# DCP-10: XML-signed CPLs and PKLs for the signature tests (openssl and xmlsec1 oracles).
cfa4-dcp = { workspace = true, features = ["test-util"] }
# The round trip: a package written by CFA4's own DCP export, validated by the native backend.
cfa4-export = { workspace = true }
cfa4-media = { workspace = true }
# DCP-08: ST 429-5 timed text track files for the subtitle tests.
cfa4-mxf = { workspace = true, features = ["test-util"] }
cfa4-project = { workspace = true }
cfa4-render = { workspace = true }
cfa4-time = { workspace = true }
