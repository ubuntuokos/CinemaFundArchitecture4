[package]
name = "cfa4-surface"
description = "CFA4 control surfaces: device discovery for ALSA sequencer MIDI ports and HID jog/shuttle controllers (hidraw), CFA4-CONTROL-SURFACE-001"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cfa4-surface-model = { workspace = true }
serde = { workspace = true }
# the ALSA sequencer; the same version cpal and cfa4-tcsync-io build on (alsa-sys `links = "alsa"`)
alsa = "0.9"
# poll() on the hidraw node, so the reading thread can stop (already in the lockfile)
rustix = { version = "1", default-features = false, features = ["std", "event"] }

[dev-dependencies]
serde_json = { workspace = true }
