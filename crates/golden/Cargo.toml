[package]
name = "cfa4-golden"
description = "Golden-image tests for the CPU renderer/compositor and GPU-vs-CPU parity (test-only crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Test-only: the library is empty and everything is a dev-dependency, so the crate adds no edges
# to the layer graph. Goldens live in `goldens/` (see docs/testing.md §3).
[dependencies]

[dev-dependencies]
cfa4-testkit = { workspace = true }
cfa4-color = { workspace = true }
cfa4-frame = { workspace = true }
cfa4-time = { workspace = true }
cfa4-geom = { workspace = true }
cfa4-media = { workspace = true }
cfa4-project = { workspace = true }
cfa4-render = { workspace = true }
cfa4-gpu = { workspace = true }
pollster = "1.0"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
