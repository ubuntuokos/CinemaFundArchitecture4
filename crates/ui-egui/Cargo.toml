[package]
name = "cfa4-ui-egui"
description = "The CFA4 egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cfa4-ui = { workspace = true }
cfa4-time = { workspace = true }
cfa4-geom = { workspace = true }
cfa4-color = { workspace = true }
cfa4-frame = { workspace = true }
cfa4-media = { workspace = true }
cfa4-project = { workspace = true }
cfa4-tts = { workspace = true }
cfa4-edit = { workspace = true }
cfa4-render = { workspace = true }
cfa4-text = { workspace = true }
cfa4-audio-dsp = { workspace = true }
cfa4-engine = { workspace = true }
cfa4-export = { workspace = true }
cfa4-gpu = { workspace = true }
cfa4-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# PNG decoding for UI images.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "0.4"
cfa4-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
cfa4-platform = { workspace = true }
cfa4-interchange = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"
