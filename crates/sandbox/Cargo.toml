[package]
name = "cfa4-sandbox"
description = "CFA4 run-time security layer: per-process Landlock and seccomp profiles (CFA4-SECURITY-001 B1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Kernel interfaces through their safe Rust APIs: no `unsafe` in this crate (AGENTS.md §0.3).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
libc = "0.2"
