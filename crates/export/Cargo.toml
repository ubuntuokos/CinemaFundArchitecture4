[package]
name = "cfa4-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cfa4-time = { workspace = true }
cfa4-frame = { workspace = true }
cfa4-color = { workspace = true }
cfa4-media = { workspace = true }
cfa4-project = { workspace = true }
cfa4-render = { workspace = true }
cfa4-audio-dsp = { workspace = true }
cfa4-geom = { workspace = true }
cfa4-text = { workspace = true }
cfa4-isobmff = { workspace = true }
cfa4-prores = { workspace = true }
cfa4-dnx = { workspace = true }
cfa4-apv = { workspace = true }
cfa4-mxf = { workspace = true }
cfa4-aac = { workspace = true }
cfa4-flac = { workspace = true }
cfa4-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
cfa4-testkit = { workspace = true }
cfa4-codecs = { workspace = true }
