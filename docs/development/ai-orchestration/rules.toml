# CFA4-DEV-AI-ORCHESTRATION-001, F2 / WP2 (TC-01): agent rule register.
#
# The register holds REFERENCES only. The text of every rule stays in its source file (`AGENTS.md` is
# the single text source, D-F2-2 option A); nothing here is a second copy that could drift. The parity
# test `python/tests/test_agent_rules_parity.py` checks the register against the repository.
#
# Fields of a [[rule]]:
#   id            CFA4-RULE-NNN, unique. Stable: never reuse or renumber an id.
#   title         short name, for people.
#   source        repository file the rule is written in.
#   anchor        text that must occur in `source` (whitespace-insensitive): the section key.
#   level         how the rule is enforced today:
#                   "ci"   a CI check fails,
#                   "hook" a Claude Code hook stops the action (must be wired in .claude/settings.json),
#                   "text" written down only; nothing checks that it is followed.
#   coverage      for "ci"/"hook" only: "full", or "partial" when the mechanism checks part of the rule.
#   enforced_by   repository files of the mechanism (must exist). Required for "ci"/"hook".
#   scope         ["claude-code"]. ThinkRail and Pi are paused (FINAL 1.2 D-C2), so nothing else is built.
#   pi            reserved for the Pi side; stays empty until the owner un-pauses it.
#   status        "active", or "conflict" for an unresolved clash (the test fails while one is open).
#   conflicts_with / resolution   ids of a clashing rule, and how the clash was settled (both required).
#   claude_md     the bold lead-ins of CLAUDE.md "Non-negotiables" bullets this rule covers.
#   note          optional, for people.
#
# Honest reading: "text" rules are listed so that they exist, have a source and are not forgotten. The
# test proves the reference is real; it does not prove the rule is obeyed. Only "ci" and "hook" rules
# are enforced, and "partial" ones only in part (WP0 inventory, section 2 and C-4).

schema_version = 1

# Non-negotiable CLAUDE.md bullets that are not conformance rules and so need no register row.
[[claude_md_exempt]]
point = "Usage budget"
reason = "model and cost preference (opusplan, Haiku sub-agents, jq-filtered API output); nothing to conform to or check"

