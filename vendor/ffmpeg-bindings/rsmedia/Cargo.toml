# Vendored by scripts/dev/vendor_ffmpeg_bindings.py from https://github.com/dromara/rsmedia @ eb0dbd0a702ea6be59fa70035ec358ce9d9888d3.
# Adapted: Git dependencies replaced by local paths; tests, examples and benches not vendored.
[package]
name = "rsmedia"
edition = "2024"
version = "0.7.1"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "High-level video toolkit based on ffmpeg."
keywords = ["video", "ffmpeg", "encoding", "decoding", "muxing"]
categories = ["multimedia", "multimedia::video", "multimedia::audio"]
authors = ["phial3"]
repository = "https://github.com/dromara/rsmedia.git"
publish = false

[dependencies]
libc = "0.2"
log = "0.4"
url = "2.5"
tracing = "0.1"
dashmap = "6.1"
once_cell = "1.21"
num_cpus = "1.17"
colorous = "1.0"
bytemuck = "1.25"
num-traits = "0.2"
image = "0.25"
palette = "0.7"
colorutils-rs = "0.8"
yuv = { version = "0.8", features = ["rayon", "professional_mode"] }
ndarray = { version = "0.17", optional = true }
rsmpeg = { path = "../rsmpeg", default-features = false }

[features]
default = ["ndarray", "ffmpeg9", "link_system_ffmpeg"]
ffmpeg6 = ["rsmpeg/ffmpeg6_1"]
ffmpeg7 = ["rsmpeg/ffmpeg7_1"]
ffmpeg8 = ["rsmpeg/ffmpeg8_1"]
ffmpeg9 = ["rsmpeg/ffmpeg9"]
link_system_ffmpeg = ["rsmpeg/link_system_ffmpeg"]
link_vcpkg_ffmpeg = ["rsmpeg/link_vcpkg_ffmpeg"]

[lints.rust]
unknown_lints = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
