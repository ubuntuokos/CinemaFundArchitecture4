# Vendored by scripts/dev/vendor_ffmpeg_bindings.py from https://github.com/phial3/rusty_ffmpeg @ 045c0262cea4f83d504d5c588e2e98e03655e7bb.
# Adapted: Git dependencies replaced by local paths; tests, examples and benches not vendored.
[package]
name = "rusty_ffmpeg"
version = "0.18.1+ffmpeg.9.0"
authors = ["ldm0 <ldm2993593805@163.com>"]
edition = "2024"
rust-version = "1.89"
description = "A library that provides Rust bindings for FFmpeg"
repository = "https://github.com/CCExtractor/rusty_ffmpeg/"
license = "MIT"
keywords = ["ffmpeg", "ffi", "binding", "video", "audio"]
categories = ["external-ffi-bindings", "multimedia"]
build = "build.rs"
links = "ffmpeg"
publish = false

[lib]
doctest = false

[build-dependencies]
bindgen = "0.73"
camino = "1.1"
once_cell = "1.12"
vcpkg = { version = "0.2", optional = true }

[target."cfg(not(windows))".build-dependencies]
pkg-config = "0.3"

[features]
link_system_ffmpeg = []
link_vcpkg_ffmpeg = ["vcpkg"]
use_prebuilt_binding = []
ffmpeg5 = []
ffmpeg5_1 = ["ffmpeg5"]
ffmpeg6 = ["ffmpeg5_1"]
ffmpeg6_1 = ["ffmpeg6"]
ffmpeg7 = ["ffmpeg6_1"]
ffmpeg7_1 = ["ffmpeg7"]
ffmpeg8 = ["ffmpeg7_1"]
ffmpeg8_1 = ["ffmpeg8"]
ffmpeg9 = ["ffmpeg8_1"]
