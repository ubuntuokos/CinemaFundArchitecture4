[package]
name = "cfa4"
description = "CFA4 desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "cfa4"
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# Optional GStreamer fallback media backend (ADR 0002; needs libgstreamer1.0-dev and
# libgstreamer-plugins-base1.0-dev to build). Without it the app behaves exactly as before.
gstreamer = ["cfa4-gstreamer/gstreamer"]
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["cfa4-engine/whisper", "cfa4-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["cfa4-engine/neural-voices"]

[dependencies]
cfa4-engine = { workspace = true }
cfa4-export = { workspace = true }
cfa4-project = { workspace = true }
cfa4-render = { workspace = true }
cfa4-time = { workspace = true }
cfa4-gpu = { workspace = true }
cfa4-ui-egui = { workspace = true }
cfa4-platform = { workspace = true }
cfa4-gstreamer = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
cpal = "0.16"
# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
# Help menu / About links in the system browser (MIT).
open = "5"

[dev-dependencies]
glob = "0.3"
# graphics.rs: enumerate the real adapters in a test.
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "5.19"

# Icon + VERSIONINFO for cfa4.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
