[package]
name = "cfa4-fetch"
description = "CFA4 downloader process: the downloads the user asked for (AI models, natural voices), confined by the cfa4-sandbox fetch profile (CFA4-SECURITY-001 D5)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "cfa4-fetch"
path = "src/main.rs"

[dependencies]
cfa4-fetch-client = { workspace = true }
cfa4-sandbox = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# HTTPS in pure Rust: rustls with the ring provider and the operating system's certificate verifier
# (moved here from cfa4-speech: the engine itself has no network code, plan D5).
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3.27"
