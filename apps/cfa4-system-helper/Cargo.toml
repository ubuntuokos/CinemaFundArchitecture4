[package]
name = "cfa4-system-helper"
description = "CFA4 system helper: the only program CFA4 runs as root (through pkexec), with a closed list of verbs and components, plan digests and an undo record (ADR 0017, CFA4-SETTINGS-HW-003 R1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "cfa4-system-helper"
path = "src/main.rs"

[dependencies]
cfa4-route = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
