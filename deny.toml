# cargo-deny configuration: licence policy for CFA4 (GPL-3.0-or-later).
# Run: cargo deny check licenses sources advisories
# Policy and reasons: docs/licensing.md §6.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
# The list is policy, not inventory: allowed licences need not be in use today.
unused-allowed-license = "allow"
# Every licence below is compatible with distributing CFA4 under GPL-3.0-or-later.
# NOT allowed on purpose: GPL-2.0-only (incompatible with GPL-3.0), AGPL-3.0, non-free licences.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
]

# Licences that cover bundled data rather than code.
exceptions = [
    # Default UI fonts embedded by egui.
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[licenses.private]
# Workspace crates are checked through the workspace licence field, not as dependencies.
ignore = true

[bans]
multiple-versions = "allow"

[advisories]
# Checked in CI (`cargo deny check advisories`). Every ignore needs a reason and a way out;
# inventory and reachability notes: docs/audit/F1-01-SBOM-2026-10-25.md §3. Dependabot still
# opens update PRs. Remove an entry as soon as the dependency moves.
ignore = [
    # Default build: zbus/accesskit (egui, frozen until the Qt6 GUI reaches parity) pull these.
    # Unmaintained only, no known vulnerability; they leave with the egui frontend.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; via zbus/accesskit, leaves with egui" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; via zbus/accesskit, leaves with egui" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; via zbus/accesskit, leaves with egui" },
    # Optional `whisper` / `neural-voices` only. CFA4 opens archives read-only (ZipArchive::new)
    # and never calls extract(); the fix is in zip 9.x, which candle-core has not adopted yet.
    { id = "RUSTSEC-2026-0367", reason = "zip extract() SUID bits; extract() is never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() symlink escape; extract() is never called" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() permissions via symlink; extract() is never called" },
    # Optional `whisper` / `neural-voices` only (candle-core); unmaintained, no known vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; via candle-core, upstream-dependent" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
