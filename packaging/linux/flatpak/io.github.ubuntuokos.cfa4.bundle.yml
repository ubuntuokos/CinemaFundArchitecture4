# CFA4 Linux x86_64 (AMD64) single-file Flatpak bundle manifest.
# (cfa4-<version>-linux-x86_64.flatpak). Build via packaging/linux/flatpak-bundle.sh.
#
# It repackages the Linux x86_64 tarball from package.sh instead of compiling Rust
# inside flatpak-builder; runtime/glibc compatibility must be validated for each release.
# The script unpacks the tarball into `stage/` beside this file. The binaries load X11,
# Wayland, xkbcommon, ALSA and Vulkan at runtime; the freedesktop runtime has all of them (its
# ALSA routes through PulseAudio/PipeWire), and the GPU driver comes from its
# org.freedesktop.Platform.GL extension.
#
# io.github.ubuntuokos.cfa4.yml (same directory) is a separate from-source manifest. Keep
# runtime-version and finish-args identical in both (static policy check).
id: io.github.ubuntuokos.cfa4
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# The Qt 6 GUI is what `flatpak run` and the menu entry start (owner decision 2026-11-12), as in the
# from-source manifest; the frozen egui editor: `flatpak run --command=cfa4 io.github.ubuntuokos.cfa4`.
command: cfa4-qt
finish-args:
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # Audio playback and the mixer's meters (cpal over ALSA, which the runtime routes to the
  # host's PulseAudio or PipeWire server).
  - --socket=pulseaudio
  # GPU access for the wgpu compositor, scopes and effects (Vulkan, or GL as a fallback).
  - --device=dri
  # A project refers to its media by absolute path (docs/project-files.md), and the document
  # portal only exposes the file it was handed, not the media beside it: a project opened from
  # ~/Videos found none of its clips (#107). So, as other video editors do, CFA4 reads and
  # writes the home directory (media, projects, exports, autosave next to the project) and the
  # usual mount points of external drives, where footage often lives. Open/Save dialogs still go
  # through the file-chooser portal; nothing outside these locations is granted.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network io.github.ubuntuokos.cfa4` exposes it
  # to host agents) and host-wide filesystem access.
modules:
  # MIT Kerberos (libgssapi_krb5.so.2): the Qt 6 wheels' QtNetwork and QtMultimedia need it and the
  # freedesktop runtime has none, so without it the Qt GUI cannot start in the sandbox. Only the
  # shared libraries stay, with their licence (MIT-style NOTICE) in share/doc/cfa4/krb5. The tarball's
  # PGP signature checks out against Greg Hudson's key (C4493CB739F4A89F9852CBC20CBA08575F8372DF).
  - name: krb5
    subdir: src
    config-opts:
      - --localstatedir=/var/lib
      - --disable-static
      - --disable-rpath
      - --without-system-verto
    post-install:
      - install -Dm644 ../NOTICE /app/share/doc/cfa4/krb5/NOTICE
    cleanup:
      - /bin
      - /sbin
      - /include
      - /lib/pkgconfig
      - /lib/krb5/plugins/kdb
      - /share/man
      - /share/examples
      - /share/locale
      - /share/et
      - /var
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.3.tar.gz
        sha256: fe90af8441ad9fa9b064b8e53077cefb782a96f8a68276b031dc54af1789ff0b
  - name: cfa4
    buildsystem: simple
    build-commands:
      - test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64
      - install -Dm755 bin/cfa4 /app/bin/cfa4
      - install -Dm755 bin/cfa4-cli /app/bin/cfa4-cli
      - install -Dm644 share/applications/io.github.ubuntuokos.cfa4.desktop /app/share/applications/io.github.ubuntuokos.cfa4.desktop
      # The same MIME file the .deb installs: it defines the .fcproj project type (the
      # runtime's shared-mime-info already knows the video and audio formats).
      - install -Dm644 share/mime/packages/io.github.ubuntuokos.cfa4.xml /app/share/mime/packages/io.github.ubuntuokos.cfa4.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.ubuntuokos.cfa4.metainfo.xml /app/share/metainfo/io.github.ubuntuokos.cfa4.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/cfa4 /app/share/doc/
      # CFA4's FFmpeg 9.0.2 (ADR 0005 step 4) with the libraries it loads that the runtime lacks and
      # their licences: the binaries find it in ../lib/cfa4/ffmpeg-9.0.2 ($ORIGIN RUNPATH). No
      # patent-restricted encoder: x264/x265 exist only in the cfa4-restricted-extras .deb.
      - mkdir -p /app/lib/cfa4 && cp -R lib/cfa4/ffmpeg-9.0.2 /app/lib/cfa4/
      # The Qt 6 GUI (docs/qt-parity.md 1.10), the bundle's command: `flatpak run io.github.ubuntuokos.cfa4`.
      # Its Python package, and the PySide6 / Qt 6 that flatpak-bundle.sh staged from the pinned
      # wheels (the runtime's python3 runs it; the licences went to share/doc/cfa4/pyside6 above).
      - install -Dm755 bin/cfa4-qt /app/bin/cfa4-qt
      - cp -R lib/cfa4/python lib/cfa4/pyside6 /app/lib/cfa4/
    sources:
      - type: dir
        path: stage
